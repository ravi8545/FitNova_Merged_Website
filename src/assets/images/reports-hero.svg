<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="reportsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D15" />
      <stop offset="60%" stop-color="#0D1623" />
      <stop offset="100%" stop-color="#060A10" />
    </linearGradient>
    <radialGradient id="greenSpotlight" cx="65%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#2BAF34" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#0F3814" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="240" fill="url(#reportsBg)" />
  <circle cx="680" cy="100" r="280" fill="url(#greenSpotlight)" />

  <!-- Subtly textured background grid -->
  <g stroke="#2BAF34" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="100" x2="1000" y2="100" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="220" x2="1000" y2="220" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="800" y1="0" x2="800" y2="240" />
  </g>

  <!-- Stylized Motivational Typography in Background -->
  <g opacity="0.3" transform="translate(680, 70)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18" fill="#94A3B8" letter-spacing="4">TRACK</text>
    <text x="0" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18" fill="#94A3B8" letter-spacing="4">ANALYZE</text>
    <text x="0" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18" fill="#94A3B8" letter-spacing="4">IMPROVE</text>
    <text x="0" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#2BAF34" letter-spacing="3" filter="url(#neonBlur)">GET STRONGER</text>
  </g>

  <!-- Athlete Silhouette with Green Rim Light -->
  <g transform="translate(520, -10)" opacity="0.65">
    <!-- Back & Shoulders Silhouette -->
    <path d="M 60 120 C 70 80, 85 45, 110 35 C 130 25, 150 25, 165 32 C 185 42, 200 75, 215 110 C 230 135, 255 160, 275 190 C 285 205, 290 230, 295 260 L 20 260 C 25 220, 45 155, 60 120 Z" fill="#0C141F" stroke="#2BAF34" stroke-width="2.5" stroke-opacity="0.8" filter="url(#neonBlur)" />
    
    <!-- Muscular definition strokes -->
    <path d="M 125 55 Q 140 100 145 160" stroke="#35D440" stroke-width="2" stroke-opacity="0.5" fill="none" />
    <path d="M 100 75 Q 120 120 115 170" stroke="#2BAF34" stroke-width="2" stroke-opacity="0.3" fill="none" />
    <path d="M 175 70 Q 165 115 170 170" stroke="#2BAF34" stroke-width="2" stroke-opacity="0.3" fill="none" />
    
    <!-- Arm lifting barbell / dumbbell silhouette -->
    <path d="M 40 150 L 10 130 L 25 90 L 55 110 Z" fill="#0C141F" stroke="#2BAF34" stroke-width="1.5" stroke-opacity="0.6" />
    <rect x="-5" y="70" width="30" height="70" rx="6" fill="#152130" stroke="#35D440" stroke-width="2" stroke-opacity="0.8" />
  </g>

  <!-- Ambient light particle accents -->
  <circle cx="580" cy="60" r="3" fill="#35D440" opacity="0.8" filter="url(#neonBlur)" />
  <circle cx="850" cy="140" r="3.5" fill="#35D440" opacity="0.7" filter="url(#neonBlur)" />
  <circle cx="730" cy="200" r="2.5" fill="#2BAF34" opacity="0.9" />
</svg>
