<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Studio Glow -->
    <radialGradient id="bcaaBackdrop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Cylindrical Tub Lighting (Photorealistic Shading) -->
    <linearGradient id="tubBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="15%" stop-color="#1F2A38" />
      <stop offset="35%" stop-color="#334155" />
      <stop offset="55%" stop-color="#1E293B" />
      <stop offset="85%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>

    <!-- Specular Highlight Streak -->
    <linearGradient id="specularGleam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Chrome/Metallic Blue Foil Label -->
    <linearGradient id="blueFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="30%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Ribbed Cap Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="25%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="75%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>

    <!-- Soft Studio Shadow -->
    <radialGradient id="dropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Studio Ambient Light -->
  <circle cx="200" cy="200" r="170" fill="url(#bcaaBackdrop)" />

  <!-- Ground Drop Shadow -->
  <ellipse cx="200" cy="350" rx="110" ry="22" fill="url(#dropShadow)" />

  <!-- Main Tub Group -->
  <g transform="translate(0, 5)">
    <!-- Base Tub Body -->
    <path d="M 108 120 C 108 105, 120 95, 136 95 L 264 95 C 280 95, 292 105, 292 120 L 292 310 C 292 328, 276 338, 252 338 L 148 338 C 124 338, 108 328, 108 310 Z" fill="url(#tubBody)" />

    <!-- Specular Highlight Overlay -->
    <rect x="152" y="95" width="28" height="243" fill="url(#specularGleam)" />

    <!-- Tub Neck/Collar -->
    <rect x="130" y="80" width="140" height="18" rx="3" fill="#1E293B" />

    <!-- Ribbed Screw Cap -->
    <rect x="120" y="44" width="160" height="38" rx="6" fill="url(#capGrad)" stroke="#475569" stroke-width="1.5" />
    <!-- Cap Ridges / Grip Texture -->
    <g stroke="#0F172A" stroke-width="2" opacity="0.6">
      <line x1="130" y1="46" x2="130" y2="80" />
      <line x1="142" y1="46" x2="142" y2="80" />
      <line x1="154" y1="46" x2="154" y2="80" />
      <line x1="166" y1="46" x2="166" y2="80" />
      <line x1="178" y1="46" x2="178" y2="80" />
      <line x1="190" y1="46" x2="190" y2="80" />
      <line x1="202" y1="46" x2="202" y2="80" />
      <line x1="214" y1="46" x2="214" y2="80" />
      <line x1="226" y1="46" x2="226" y2="80" />
      <line x1="238" y1="46" x2="238" y2="80" />
      <line x1="250" y1="46" x2="250" y2="80" />
      <line x1="262" y1="46" x2="262" y2="80" />
      <line x1="270" y1="46" x2="270" y2="80" />
    </g>
    <!-- Cap Top Highlight -->
    <ellipse cx="200" cy="46" rx="78" ry="7" fill="#64748B" opacity="0.5" />

    <!-- Commercial Matte Label -->
    <rect x="112" y="130" width="176" height="180" rx="8" fill="#0C131D" stroke="#1E2E40" stroke-width="1.5" />

    <!-- Metallic Blue Foil Accent Stripes -->
    <rect x="112" y="130" width="176" height="8" fill="url(#blueFoil)" />
    <rect x="112" y="302" width="176" height="8" fill="url(#blueFoil)" />

    <!-- Brand Typography & Packshot Elements -->
    <g text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <!-- Brand Name -->
      <text x="200" y="162" font-size="13" font-weight="900" fill="#E2E8F0" letter-spacing="4">MYPROTEIN</text>

      <!-- Blue Energy Pill Badge -->
      <rect x="150" y="172" width="100" height="18" rx="9" fill="url(#blueFoil)" />
      <text x="200" y="185" font-size="9" font-weight="800" fill="#FFFFFF" letter-spacing="1">PREMIUM AMINO</text>

      <!-- Main Product Title -->
      <text x="200" y="224" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="2">BCAA</text>
      
      <!-- Ratio Badge -->
      <text x="200" y="246" font-size="16" font-weight="800" fill="#60A5FA" letter-spacing="3">8 : 1 : 1</text>
      
      <!-- Subtitle -->
      <text x="200" y="266" font-size="9.5" font-weight="700" fill="#94A3B8" letter-spacing="1.5">INTRA-WORKOUT FORMULA</text>

      <!-- Product Features / Key Specs -->
      <rect x="126" y="278" width="148" height="16" rx="4" fill="#141E2B" />
      <text x="200" y="289" font-size="7.5" font-weight="600" fill="#38BDF8">7g BCAAs • 0g SUGAR • ZERO CALORIE</text>
    </g>

    <!-- Edge Rim Lighting -->
    <path d="M 110 135 L 110 305" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6" />
    <path d="M 290 135 L 290 305" stroke="#1D4ED8" stroke-width="1.5" stroke-opacity="0.4" />
  </g>
</svg>
